name: apply wot custom feed
on:
  push:
    branches: [wot-custom-feed]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch from the earlier payload commit
        run: |
          set -euo pipefail
          git show b866e1f6864346d84158abbccdeee5a6fd6fee3b:.github/wot.patch.gz.b64 > /tmp/bad.b64
          python3 - << 'PY'
          import base64, gzip, hashlib, pathlib
          chars = list(pathlib.Path("/tmp/bad.b64").read_text().strip())
          if len(chars) != 11141 or chars[3721] != "v" or chars[6122] != "h":
              raise SystemExit("unexpected payload")
          del chars[3721]
          if chars[6121] != "h":
              raise SystemExit("expected h at 6121")
          chars[6121] = "n"
          patch = gzip.decompress(base64.b64decode("".join(chars)))
          digest = hashlib.sha256(patch).hexdigest()
          if digest != "c3ad1a3ac7cb6887712c2cb2fd219da4e76fe537d69c9a3b0eb786e8f75f9440":
              raise SystemExit("bad patch digest " + digest)
          pathlib.Path("/tmp/wot.patch").write_bytes(patch)
          PY
          git apply --check /tmp/wot.patch
          git apply /tmp/wot.patch
          git add -A
          git rm -f .github/workflows/apply-wot-custom-feed.yml
          git config user.name "kirpy0x"
          git config user.email "47724110+kirpy0x@users.noreply.github.com"
          git commit -m "Limit a custom feed to the web of trust"
          git push
